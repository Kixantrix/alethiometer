; The Alethiometer - ESP32-S3 firmware (Unexpected Maker ProS3)
; arduino-esp32 core 3.3.x via the pioarduino community platform (pinned for reproducible
; builds; the official espressif32 platform only ships core 2.x).

[platformio]
default_envs = pros3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = um_pros3
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; um_pros3 already defines BOARD_HAS_PSRAM, ARDUINO_USB_CDC_ON_BOOT=1 and ARDUINO_USB_MODE=1.
build_flags =
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; First flash: USB (before the board is installed in the case).
[env:pros3]
upload_speed = 921600

; After assembly: over-the-air (the USB port inside the case is power-only). The OTA
; password is the device key:
;   $env:ALETHIOMETER_KEY = "<device key>"; pio run -e pros3_ota -t upload
[env:pros3_ota]
upload_protocol = espota
upload_port = alethiometer.local
upload_flags = --auth=${sysenv.ALETHIOMETER_KEY}
